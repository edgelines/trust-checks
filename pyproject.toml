[project]
name = "trust-checks"
version = "0.1.0"
description = "주석 금지·검사 끄기 표시·기준 숫자·저장소 검사 공용 도구"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
trust-checks = "trust_checks.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pyyaml>=6.0"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
