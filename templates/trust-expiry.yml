name: Trust Expiry

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trust-expiry-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trust-expiry:
    runs-on: __RUNNER_LABELS__
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install TS dependencies
        run: __INSTALL_TS_DEPENDENCIES__
      - name: Find expired suppressions
        id: expired
        run: |
          if uvx --from git+https://github.com/edgelines/trust-checks@v0.1.1 trust-checks expired > "$RUNNER_TEMP/trust-expiry-report.md" 2>&1; then
            result=0
          else
            result=$?
          fi
          cat "$RUNNER_TEMP/trust-expiry-report.md"
          first_line=$(head -n 1 "$RUNNER_TEMP/trust-expiry-report.md")
          if [[ "$result" = 1 ]]; then
            last_line=$(tail -n 1 "$RUNNER_TEMP/trust-expiry-report.md")
            expired_summary='^expired: 만료가 지난 검사 끄기 표시 [0-9]+개$'
            if [[ "$first_line" == "trust_checks: 오류:"* || ! "$last_line" =~ $expired_summary ]]; then
              exit 1
            fi
          fi
          case "$result" in
            0|1) echo "result=$result" >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Update expiry issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPIRED_RESULT: ${{ steps.expired.outputs.result }}
        run: |
          labels=$(gh api --paginate "repos/$GH_REPO/labels?per_page=100" --jq '.[].name')
          for label in baseline-approved trust-expiry; do
            if ! printf '%s\n' "$labels" | grep -Fx "$label" > /dev/null; then
              gh label create "$label"
            fi
          done
          issues=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and .title == "만료된 검사 끄기 표시") | .number')
          if [ "$EXPIRED_RESULT" = 1 ]; then
            issue=$(printf '%s\n' "$issues" | head -n 1)
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/trust-expiry-report.md" --add-label trust-expiry
              for duplicate in $issues; do
                if [ "$duplicate" != "$issue" ]; then
                  gh issue close "$duplicate"
                fi
              done
            else
              gh issue create --title '만료된 검사 끄기 표시' --label trust-expiry --body-file "$RUNNER_TEMP/trust-expiry-report.md"
            fi
          else
            for issue in $issues; do
              gh issue close "$issue"
            done
          fi