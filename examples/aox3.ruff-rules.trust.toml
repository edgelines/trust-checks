codes = ["BLE001"]
roots = ["backend/src", "backend/core", "backend/main.py"]
exclude = ["backend/src/services/trading/gates"]
version = "0.15.0"
fix = "잡을 예외를 좁혀 적는다. 넓게 잡아야 하면 기록한 뒤 다시 던진다"

