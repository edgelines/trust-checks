name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      TRUST_BASELINE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'baseline-approved') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Check changed file comments
        if: ${{ !cancelled() }}
        run: uv run --locked trust-checks comments --base "$BASE_SHA"
      - name: Check repository rules
        if: ${{ !cancelled() }}
        run: uv run --locked trust-checks repo
      - name: Check trust metrics
        if: ${{ !cancelled() }}
        run: uv run --locked trust-checks metrics --check --base "$BASE_SHA"
